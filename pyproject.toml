[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent prototype for Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.50",
    "numpy>=1.26",
    "pypdf>=5.0",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
